<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice | Scripture Learning</title>
<link rel="stylesheet" href="style.css">
<style>
  .tile-passage {
    font-size: 1.3rem;
    line-height: 2.4;
  }
  .tile {
    display: inline;
    cursor: pointer;
    background: var(--color-pinned-bg);
    border-radius: 4px;
    padding: 0.05rem 0.2rem;
  }
  .tile.revealed {
    background: transparent;
    cursor: default;
    padding: 0;
  }
  .mode-tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .mode-tabs button {
    flex: 1;
  }
  .mode-tabs button.active {
    background: var(--color-primary-dark);
  }
  .level-indicator {
    font-size: 0.95rem;
    color: var(--color-primary-dark);
    margin-bottom: 0.75rem;
  }
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="site-header">
  <h1>Scripture Learning</h1>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="daily-review.html">Daily Review</a>
    <a href="my-scriptures.html">My Scriptures</a>
    <a href="add.html">Add Scripture</a>
  </nav>
</header>
<main id="main-content">
  <div id="content">Loading&hellip;</div>
</main>
<footer class="site-footer">Scripture Learning</footer>
<script src="js/api.js"></script>
<script>
  const scriptureId = Number(new URLSearchParams(window.location.search).get('id'));
  const isDaily = new URLSearchParams(window.location.search).get('daily') === '1';
  let scripture = null;
  let mode = 'text'; // 'text' | 'reference'
  let tiles = [];

  const RATINGS = [
    { key: 'forgot', label: 'Forgot It' },
    { key: 'difficult', label: 'Difficult' },
    { key: 'got_it', label: 'Got It' },
    { key: 'easy', label: 'Easy' },
  ];

  const LEVEL_NAMES = {
    1: 'Phrase-by-Phrase Chaining',
    2: 'Progressive Word Hiding',
    3: 'Word-Length Blanks',
    4: 'First-Letter Mode',
    5: 'Recite from Reference',
  };

  // ---- Level 1: phrase-by-phrase chaining ----
  // No hidden words here at all -- the passage grows one phrase at a time,
  // repeated CHAIN_REPS times at each size, so there's nothing to tap-reveal
  // and no percent to compute. See ROADMAP.md for the full technique.
  const CHAIN_REPS = 3;
  let chainSteps = [];
  let chainStepIndex = 0;
  let chainRepCount = 0;

  function splitParagraphs(text) {
    const paragraphs = text.split(/\n\s*\n/).map(p => p.trim()).filter(p => p.length > 0);
    return paragraphs.length ? paragraphs : [text.trim()];
  }

  // Targets ~80 characters per phrase, preferring to break on a nearby
  // punctuation mark over a hard 80-char cut, and never mid-word if no
  // punctuation is nearby. Returns end-offsets into `text`, so
  // text.slice(0, offset) always reproduces the original text exactly --
  // no rejoining, no risk of altering spacing/punctuation.
  function findPhraseBreakpoints(text) {
    const TARGET = 80;
    const WINDOW = 20;
    const PUNCTUATION = /[.,;:!?]/;
    const breakpoints = [];
    let pos = 0;
    while (pos < text.length) {
      const remaining = text.length - pos;
      if (remaining <= TARGET + WINDOW) {
        breakpoints.push(text.length);
        break;
      }
      const searchStart = pos + Math.max(TARGET - WINDOW, 1);
      const searchEnd = Math.min(pos + TARGET + WINDOW, text.length);
      let bestIndex = -1;
      let bestDistance = Infinity;
      for (let i = searchStart; i < searchEnd; i++) {
        if (PUNCTUATION.test(text[i])) {
          const distance = Math.abs((i - pos) - TARGET);
          if (distance < bestDistance) {
            bestDistance = distance;
            bestIndex = i;
          }
        }
      }
      let breakAt;
      if (bestIndex !== -1) {
        breakAt = bestIndex + 1; // include the punctuation mark in this phrase
      } else {
        let idx = pos + TARGET;
        while (idx < text.length && idx < pos + TARGET + WINDOW && !/\s/.test(text[idx])) idx++;
        breakAt = Math.min(idx, pos + TARGET + WINDOW, text.length);
      }
      breakpoints.push(breakAt);
      pos = breakAt;
    }
    return breakpoints;
  }

  // Builds the full ordered list of chaining steps: each paragraph grows
  // phrase-by-phrase on its own, then (from the 2nd paragraph on) one extra
  // step recites every paragraph seen so far together.
  function buildChainSteps(fullText) {
    const paragraphs = splitParagraphs(fullText);
    const steps = [];
    const completedParagraphs = [];
    paragraphs.forEach((paragraph, pIndex) => {
      findPhraseBreakpoints(paragraph).forEach(end => steps.push(paragraph.slice(0, end)));
      completedParagraphs.push(paragraph);
      if (pIndex > 0) steps.push(completedParagraphs.join('\n\n'));
    });
    return steps;
  }

  function startChaining() {
    chainSteps = buildChainSteps(scripture.scriptureText);
    chainStepIndex = 0;
    chainRepCount = 0;
    renderChainStep();
  }

  function renderChainStep() {
    const area = document.getElementById('practice-area');
    area.innerHTML = `
      <p class="placeholder-note">Step ${chainStepIndex + 1} of ${chainSteps.length}</p>
      <p class="scripture-text">${escapeHtml(chainSteps[chainStepIndex])}</p>
      <p>Repetition ${chainRepCount + 1} of ${CHAIN_REPS}</p>
      <p><button class="btn" id="chain-rep-btn">I Said It</button></p>
    `;
    document.getElementById('chain-rep-btn').addEventListener('click', onChainRep);
  }

  function onChainRep() {
    chainRepCount++;
    if (chainRepCount >= CHAIN_REPS) {
      chainStepIndex++;
      chainRepCount = 0;
      if (chainStepIndex >= chainSteps.length) {
        finishChaining();
        return;
      }
    }
    renderChainStep();
  }

  async function finishChaining() {
    const area = document.getElementById('practice-area');
    area.innerHTML = `<p class="placeholder-note">Saving…</p>`;
    try {
      const res = await callApi('advanceFromChaining', { id: scriptureId });
      if (res.ok) scripture.learningLevel = res.learningLevel;
      showCompletionPanel(`Nice work — the whole passage is chained together. Next up: Level ${scripture.learningLevel} (${escapeHtml(LEVEL_NAMES[scripture.learningLevel])}).`);
    } catch (e) {
      area.innerHTML = `<p class="placeholder-note">Something went wrong saving your progress.</p>`;
    }
  }

  // Splits into alternating word / whitespace chunks so original spacing
  // and line breaks are preserved exactly.
  function tokenize(text) {
    return (text.match(/\S+|\s+/g) || []).map(chunk => ({
      text: chunk,
      isWord: !/^\s+$/.test(chunk),
    }));
  }

  // 'blank' = no shape hint at all. 'length' = underscores matching each
  // letter/digit, punctuation stays visible. 'firstLetter' = first
  // letter/digit visible, rest blanked, punctuation stays visible.
  function maskWord(word, style) {
    if (style === 'blank') return '▢▢▢';
    if (style === 'length') return word.replace(/[A-Za-z0-9]/g, '_');
    if (style === 'firstLetter') {
      let used = false;
      return word.replace(/[A-Za-z0-9]/g, (ch) => {
        if (!used) { used = true; return ch; }
        return '_';
      });
    }
    return word;
  }

  // Builds the tile list for the current mode + (for text mode) the
  // scripture's current learning level.
  function buildTiles() {
    if (mode === 'reference') {
      return tokenize(scripture.reference).map(t => ({
        ...t,
        initiallyHidden: t.isWord,
        style: 'length',
        revealed: !t.isWord,
      }));
    }

    const level = scripture.learningLevel;
    const style = level === 3 ? 'length' : level === 4 ? 'firstLetter' : 'blank';
    return tokenize(scripture.scriptureText).map(t => {
      if (!t.isWord) return { ...t, initiallyHidden: false, style: null, revealed: true };
      // Level 2 only hides a random ~35% of words; levels 3-5 hide all of them.
      // (Level 1, chaining, never reaches buildTiles() at all.)
      const hidden = level === 2 ? Math.random() < 0.35 : true;
      return { ...t, initiallyHidden: hidden, style, revealed: !hidden };
    });
  }

  function renderTiles() {
    const passageEl = document.getElementById('passage');
    passageEl.innerHTML = tiles.map((t, i) => {
      if (!t.isWord) return escapeHtml(t.text);
      if (t.revealed) return `<span class="tile revealed">${escapeHtml(t.text)}</span>`;
      return `<span class="tile" data-i="${i}">${escapeHtml(maskWord(t.text, t.style))}</span>`;
    }).join('');
    passageEl.querySelectorAll('.tile:not(.revealed)').forEach(el => {
      el.addEventListener('click', () => {
        const i = Number(el.dataset.i);
        tiles[i].revealed = true;
        renderTiles();
      });
    });
  }

  function computePercent() {
    const wordTiles = tiles.filter(t => t.isWord);
    // A word counts as "recalled" if it was never hidden, or was hidden but
    // never tapped open. Anything the user tapped counts against the score.
    const tappedCount = wordTiles.filter(t => t.initiallyHidden && t.revealed).length;
    return Math.round(((wordTiles.length - tappedCount) / wordTiles.length) * 100);
  }

  // Level 1 (chaining) has an entirely different UI from levels 2-5
  // (tap-to-reveal tiles) -- both render into the same #practice-area
  // container rather than sharing fixed DOM elements, since their markup
  // needs are genuinely different.
  function startAttempt() {
    if (mode === 'text' && scripture.learningLevel === 1) {
      startChaining();
      return;
    }
    tiles = buildTiles();
    renderTileAttempt();
  }

  function renderTileAttempt() {
    const area = document.getElementById('practice-area');
    area.innerHTML = `
      <p class="tile-passage" id="passage"></p>
      <p><button class="btn" id="finish-btn">I've Recited It — Check My Score</button></p>
    `;
    renderTiles();
    document.getElementById('finish-btn').addEventListener('click', finishAttempt);
  }

  async function finishAttempt() {
    const percent = computePercent();
    const area = document.getElementById('practice-area');
    area.innerHTML = `<p class="placeholder-note">Saving…</p>`;

    try {
      const res = await callApi('recordPracticeAttempt', { id: scriptureId, mode, percent });
      if (!res.ok) {
        area.innerHTML = `<p class="placeholder-note">Couldn't save that attempt. Please try again.</p>`;
        return;
      }
      let message = `<strong>${percent}%</strong> recalled without help.`;
      if (mode === 'text') {
        scripture.learningLevel = res.learningLevel;
        if (res.justMemorized) {
          scripture.isMemorized = true;
          message += ` 🎉 Recalled independently at the top level — marked as Memorized!`;
        } else {
          message += ` Next attempt will be at level ${res.learningLevel} (${escapeHtml(LEVEL_NAMES[res.learningLevel])}).`;
        }
      }
      showCompletionPanel(message);
    } catch (e) {
      area.innerHTML = `<p class="placeholder-note">Something went wrong saving that attempt.</p>`;
    }
  }

  // Shared by both finishAttempt (tile levels) and finishChaining (level
  // 1) — isDaily always means mode === 'text' (Daily Review hides the mode
  // tabs entirely), so there's no need to check mode here too.
  function showCompletionPanel(message) {
    const area = document.getElementById('practice-area');
    if (isDaily) {
      area.innerHTML = `
        <p>${message}</p>
        <p>How did that feel?</p>
        <p>${RATINGS.map(r => `<button class="btn btn-secondary" data-rating="${r.key}">${r.label}</button>`).join(' ')}</p>
      `;
      area.querySelectorAll('[data-rating]').forEach(btn => {
        btn.addEventListener('click', () => submitRating(btn.dataset.rating));
      });
      return;
    }
    area.innerHTML = `
      <p>${message}</p>
      <p>
        <button class="btn" id="again-btn">Practice Again</button>
        <a class="btn btn-secondary" href="scripture.html?id=${scriptureId}">Back to Scripture</a>
      </p>
    `;
    document.getElementById('again-btn').addEventListener('click', () => {
      renderLevelIndicator();
      startAttempt();
    });
  }

  async function submitRating(rating) {
    const area = document.getElementById('practice-area');
    area.innerHTML = `<p class="placeholder-note">Saving…</p>`;
    try {
      const res = await callApi('recordReviewRating', { id: scriptureId, rating });
      if (!res.ok) {
        area.innerHTML = `<p class="placeholder-note">Couldn't save that rating. Please try again.</p>`;
        return;
      }
      area.innerHTML = `
        <p>Next review: <strong>${escapeHtml(res.nextReviewDate)}</strong> (in ${res.intervalDays} day${res.intervalDays === 1 ? '' : 's'}).</p>
        <p><a class="btn" href="daily-review.html">Next in Review Queue</a></p>
      `;
    } catch (e) {
      area.innerHTML = `<p class="placeholder-note">Something went wrong saving that rating.</p>`;
    }
  }

  function renderLevelIndicator() {
    const el = document.getElementById('level-indicator');
    if (mode === 'reference') {
      el.textContent = 'Given the text, recall the reference.';
    } else {
      el.textContent = `Level ${scripture.learningLevel} of ${Object.keys(LEVEL_NAMES).length}: ${LEVEL_NAMES[scripture.learningLevel]}`;
    }
  }

  function switchMode(newMode) {
    mode = newMode;
    // Tab buttons don't exist in Daily Review mode (see renderPage) — guard
    // rather than assume they're always in the DOM.
    const tabText = document.getElementById('tab-text');
    const tabReference = document.getElementById('tab-reference');
    if (tabText) tabText.classList.toggle('active', mode === 'text');
    if (tabReference) tabReference.classList.toggle('active', mode === 'reference');
    renderLevelIndicator();
    startAttempt();
  }

  function renderPage() {
    const el = document.getElementById('content');
    // Daily Review is specifically about text retention -- no mode tabs,
    // no switching to the reference quiz, just today's due passage.
    const tabsHtml = isDaily ? '' : `
      <div class="mode-tabs">
        <button class="btn" id="tab-text">Practice Text</button>
        <button class="btn" id="tab-reference">Practice Reference</button>
      </div>
    `;
    el.innerHTML = `
      <h2>${escapeHtml(scripture.reference)}${isDaily ? ' <span class="badge">Daily Review</span>' : ''}</h2>
      ${tabsHtml}
      <div class="level-indicator" id="level-indicator"></div>
      <div class="card" id="practice-area"></div>
    `;
    if (!isDaily) {
      document.getElementById('tab-text').addEventListener('click', () => switchMode('text'));
      document.getElementById('tab-reference').addEventListener('click', () => switchMode('reference'));
    }
    switchMode('text');
  }

  (async () => {
    await AUTH_READY;
    if (!scriptureId) {
      showPlaceholder(document.getElementById('content'), 'No scripture specified.');
      return;
    }
    try {
      const result = await callApiGet('listScriptures', { filter: 'all' });
      if (!result.ok) { showPlaceholder(document.getElementById('content'), "Couldn't load this scripture."); return; }
      scripture = result.scriptures.find(s => s.id === scriptureId);
      if (!scripture) { showPlaceholder(document.getElementById('content'), "That scripture wasn't found."); return; }
      renderPage();
    } catch (e) {
      showPlaceholder(document.getElementById('content'), "Couldn't load right now — check your connection and try refreshing.");
    }
  })();
</script>
</body>
</html>
